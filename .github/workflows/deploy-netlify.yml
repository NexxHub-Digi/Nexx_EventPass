name: EventPass Netlify Production Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eventpass-netlify-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify application before backup deployment
        run: |
          npm run typecheck
          npm run test:qr
          npm run test:workflow
      - name: Validate Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "Configure NETLIFY_AUTH_TOKEN in GitHub Actions secrets"; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo "Configure NETLIFY_SITE_ID in GitHub Actions secrets"; exit 1; }
      - name: Deploy full-stack Next.js to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID"
