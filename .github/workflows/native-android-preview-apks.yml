name: EventPass standalone Android preview APKs

on:
  workflow_dispatch:
    inputs:
      app:
        description: Select an app or build all four
        type: choice
        default: all
        options:
          - all
          - user
          - organiser
          - gate
          - platform-admin
  push:
    branches: [main]
    paths:
      - .github/workflows/native-android-preview-apks.yml
      - apps/gate/App.tsx
      - apps/gate/app.json

permissions:
  contents: read

concurrency:
  group: eventpass-preview-apk-${{ github.ref }}-${{ github.event.inputs.app || 'all' }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.choose.outputs.apps }}
    steps:
      - id: choose
        env:
          APP: ${{ github.event.inputs.app || (github.event_name == 'push' && 'gate') || 'all' }}
        run: |
          case "$APP" in
            all) echo 'apps=["user","organiser","gate","platform-admin"]' >> "$GITHUB_OUTPUT" ;;
            user|organiser|gate|platform-admin) printf 'apps=["%s"]\n' "$APP" >> "$GITHUB_OUTPUT" ;;
            *) echo "Invalid app selection" >&2; exit 1 ;;
          esac

  android:
    name: Standalone APK / ${{ matrix.app }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: ${{ fromJSON(needs.select.outputs.apps) }}
    env:
      CI: '1'
      EXPO_NO_GIT_STATUS: '1'
      EAS_BUILD_PROFILE: preview
      EXPO_PUBLIC_RELEASE_CHANNEL: preview
      EXPO_PUBLIC_API_URL: https://nexx-eventpass-git-staging-nexxs-projects-903f5c1d.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "Android SDK available on the hosted GitHub runner"
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm isolated Preview API
        run: |
          node - <<'NODE'
          const origin = new URL(process.env.EXPO_PUBLIC_API_URL);
          if (origin.protocol !== 'https:' || origin.hostname === 'nexx-eventpass.vercel.app' ||
              !origin.hostname.startsWith('nexx-eventpass-git-staging-') || origin.pathname !== '/') {
            throw new Error('Internal APKs must target isolated staging, not production');
          }
          NODE
      - name: Install native app dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm install --no-audit --no-fund
      - name: Check native TypeScript
        working-directory: apps/${{ matrix.app }}
        run: npx tsc --noEmit
      - name: Generate Android native project from Expo config
        working-directory: apps/${{ matrix.app }}
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated Android security manifest
        run: |
          set -euo pipefail
          MANIFEST="apps/${{ matrix.app }}/android/app/src/main/AndroidManifest.xml"
          test -s "$MANIFEST"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
      - name: Build self-contained release variant for internal testing
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify installable test-signed APK
        run: |
          APK="apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOL_DIR/apksigner"
          "$TOOL_DIR/apksigner" verify --print-certs "$APK" | grep -i "Android Debug"
      - name: Inspect Android target, package ID and 16 KiB APK alignment
        run: |
          set -euo pipefail
          APK="apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk"
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOL_DIR/aapt"
          test -x "$TOOL_DIR/zipalign"
          "$TOOL_DIR/aapt" dump badging "$APK" > /tmp/eventpass-badging.txt
          "$TOOL_DIR/aapt" dump permissions "$APK" > /tmp/eventpass-permissions.txt
          if [ "${{ matrix.app }}" = "gate" ]; then
            grep -Eq "uses-permission.*name='android.permission.CAMERA'" /tmp/eventpass-permissions.txt
          else
            if grep -Eq "uses-permission.*name='android.permission.CAMERA'" /tmp/eventpass-permissions.txt; then
              echo "Unexpected camera permission in release APK" >&2
              exit 1
            fi
          fi
          for PERM in READ_SMS READ_CONTACTS READ_CALL_LOG READ_PHONE_STATE ACCESS_FINE_LOCATION ACCESS_BACKGROUND_LOCATION REQUEST_INSTALL_PACKAGES SYSTEM_ALERT_WINDOW RECORD_AUDIO; do
            if grep -Eq "uses-permission.*name='android.permission.$PERM'" /tmp/eventpass-permissions.txt; then
              echo "Unexpected sensitive permission in APK: $PERM" >&2
              exit 1
            fi
          done
          grep -q "targetSdkVersion:'36'" /tmp/eventpass-badging.txt
          ROLE="${{ matrix.app }}"
          if [ "$ROLE" = "platform-admin" ]; then ROLE="admin"; fi
          grep -q "package: name='com.nexx.eventpass.$ROLE'" /tmp/eventpass-badging.txt
          "$TOOL_DIR/zipalign" -c -P 16 4 "$APK"
          echo "Verified Android 16 target, correct role package and 16 KiB APK zip alignment"
      - name: Upload Android internal test APK
        uses: actions/upload-artifact@v4
        with:
          name: eventpass-${{ matrix.app }}-internal-apk-${{ github.sha }}
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
