name: EventPass CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:qr
      - run: npm run test:workflow
      - run: node --test tests/gate-invitations.test.mjs
      - run: npm run build
        env:
          AUTH_SECRET: ci-auth-signing-secret-for-tests-01234567890123456789
          QR_SIGNING_SECRET: ci-qr-signing-secret-for-tests-0123456789012345
  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, organiser, gate, platform-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Expo
        working-directory: apps/${{ matrix.app }}
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        working-directory: apps/${{ matrix.app }}
        run: npx tsc --noEmit
