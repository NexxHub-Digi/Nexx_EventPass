name: EventPass CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test tests/android-release-security.test.mjs
      - run: node --test tests/mobile-download-links.test.mjs
      - run: npm run test:qr
      - run: npm run test:entry-codes
      - run: npm run test:workflow
      - run: node --test tests/manual-payment-admission-lifecycle.test.mjs
      - run: node --test tests/full-debug-media-og.test.mjs
      - run: node --test tests/admin-audit-pagination.test.mjs
      - run: node --experimental-strip-types --test tests/ticket-design-issuance-snapshot.test.mjs
      - run: node --test tests/organiser-sidebar-navigation.test.mjs
      - run: node --test tests/admin-sidebar-navigation.test.mjs
      - run: node --test tests/admin-native-finance-ledger.test.mjs
      - run: node --test tests/admin-support-workflow.test.mjs
      - run: node --test tests/platform-financial-overview.test.mjs
      - run: node --test tests/platform-admin-visual-parity.test.mjs
      - run: node --test tests/refund-settlement-controls.test.mjs
      - run: node --test tests/admin-native-control-centre.test.mjs
      - run: node --test tests/admin-organiser-rejection.test.mjs
      - run: node --test tests/admin-native-account-actions.test.mjs
      - run: node --test tests/organiser-native-media-parity.test.mjs
      - run: node --test tests/organiser-native-studio-preview.test.mjs
      - run: node --test tests/ticket-studio-persistence.test.mjs
      - run: node --test tests/organiser-native-dashboard.test.mjs
      - run: node --experimental-strip-types --test tests/user-native-discovery.test.mjs
      - run: node --test tests/gate-native-rehearsal.test.mjs
      - run: npm run test:paystack
      - run: node --test tests/android-local-apk-workflow.test.mjs
      - run: node --test tests/gate-invitations.test.mjs
      - run: node --test tests/gate-portal-access.test.mjs
      - run: node --check scripts/production-smoke.mjs
      - run: npm run build
        env:
          AUTH_SECRET: ci-auth-signing-secret-for-tests-01234567890123456789
          QR_SIGNING_SECRET: ci-qr-signing-secret-for-tests-0123456789012345
  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, organiser, gate, platform-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Expo
        working-directory: apps/${{ matrix.app }}
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        working-directory: apps/${{ matrix.app }}
        run: npx tsc --noEmit
      - name: Build Android JavaScript bundle
        working-directory: apps/${{ matrix.app }}
        run: npx expo export --platform android --output-dir /tmp/eventpass-android-${{ matrix.app }}
      - name: Build iOS JavaScript bundle
        working-directory: apps/${{ matrix.app }}
        run: npx expo export --platform ios --output-dir /tmp/eventpass-ios-${{ matrix.app }}


  legacy-web-ticket-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
