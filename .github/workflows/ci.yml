name: EventPass CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Static type checks
        run: npm run typecheck
      - name: QR security unit tests
        run: npm run test:qr
      - name: Build Next.js
        run: npm run build
        env:
          AUTH_SECRET: ci-test-secret-not-used-for-production-0123456789
          QR_SIGNING_SECRET: ci-test-qr-secret-not-used-production-0123456789
      - name: Check Expo app dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Check Expo TypeScript
        working-directory: apps/mobile
        run: npx tsc --noEmit
