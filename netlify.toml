# Nexx EventPass full-stack Next.js App Router/API + shared Neon database.
# Netlify automatically installs its OpenNext runtime. No SPA catch-all rewrites.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Runtime secrets go in Netlify Environment Variables (Builds + Functions scopes).
# Never put DATABASE_URL, AUTH_SECRET, QR_SIGNING_SECRET or Google Client Secrets here.
